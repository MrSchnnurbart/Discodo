name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version à publier (ex: 1.0.1)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build, Test & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK 36 & licenses
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version metadata
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          else
            RAW_TAG="v${{ inputs.version_name }}"
          fi
          VERSION_NAME="${RAW_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION_NAME%%-*}"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          if [[ "$VERSION_CODE" -lt 1 ]]; then
            VERSION_CODE=${{ github.run_number }}
          fi
          echo "tag_name=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          DISCODO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DISCODO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DISCODO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TAG_NAME="${{ steps.version.outputs.tag_name }}"
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"

          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$DISCODO_KEYSTORE_PASSWORD" && -n "$DISCODO_KEY_ALIAS" && -n "$DISCODO_KEY_PASSWORD" ]]; then
            export DISCODO_KEYSTORE_PATH="/tmp/discodo-release.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$DISCODO_KEYSTORE_PATH"
            ./gradlew assembleRelease \
              -PversionName="$VERSION_NAME" \
              -PversionCode="$VERSION_CODE" \
              --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "Discodo-${TAG_NAME}.apk"
            rm -f "$DISCODO_KEYSTORE_PATH"
          else
            ./gradlew assembleDebug \
              -PversionName="$VERSION_NAME" \
              -PversionCode="$VERSION_CODE" \
              --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "Discodo-${TAG_NAME}-debug.apk"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Discodo ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          files: Discodo-*.apk
